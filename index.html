<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل أكواد فودافون للشركات</title>
    <style>
        :root {
            --vf-red: #e60000;
            --vf-dark: #333333;
            --vf-light: #f4f4f4;
            --white: #ffffff;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--vf-light); margin: 0; padding: 20px; color: var(--vf-dark); line-height: 1.6; }
        header { text-align: center; margin-bottom: 40px; padding: 20px; background: var(--white); border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: var(--vf-red); margin-top: 0; font-size: 2.2em;}
        p.subtitle { color: #666; font-size: 1.1em; }
        .search-container { position: relative; max-width: 600px; margin: 20px auto 0; }
        #searchInput { width: 100%; padding: 15px 20px; border: 2px solid #ddd; border-radius: 30px; font-size: 16px; transition: all 0.3s; box-sizing: border-box; font-family: inherit; }
        #searchInput:focus { border-color: var(--vf-red); outline: none; box-shadow: 0 0 10px rgba(230,0,0,0.1); }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; max-width: 1200px; margin: auto; }
        .card { background: var(--white); border-radius: 15px; padding: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; border-top: 5px solid var(--vf-red); display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-8px); box-shadow: 0 12px 20px rgba(0,0,0,0.15); }
        .card-title { font-size: 1.3em; font-weight: bold; margin-bottom: 15px; color: var(--vf-dark); }
        .card-code { font-size: 1.6em; direction: ltr; text-align: left; background: var(--vf-light); padding: 10px 15px; border-radius: 8px; margin: 10px 0; font-family: 'Courier New', Courier, monospace; font-weight: bold; color: var(--vf-red); border: 1px dashed #ccc; }
        .card-details { max-height: 0; opacity: 0; transition: all 0.4s ease-out; overflow: hidden; margin-top: 0; }
        .card:hover .card-details { max-height: 400px; opacity: 1; margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }
        .badge { display: inline-block; padding: 5px 10px; font-size: 0.85em; border-radius: 20px; background: var(--vf-dark); color: var(--white); margin-bottom: 15px; font-weight: bold; }
        .badge.owner { background: #007bff; }
        .badge.auth { background: #28a745; }
        .badge.all { background: #6c757d; }
        .details-text { font-size: 0.95em; color: #555; margin: 0; }
        .no-results { text-align: center; grid-column: 1 / -1; font-size: 1.2em; color: #666; display: none; padding: 40px; }
        
        /* Mobile adjustment */
        @media (max-width: 600px) {
            .card-code { font-size: 1.3em; }
        }
    </style>
</head>
<body>
    <header>
        <h1> Enterpirse client's codes</h1>
        <p class="subtitle"> ابحث عن الكود اللي انت عايزه بالصيغة اللي انت عايزها 👌</p>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="ابحث باسم الخدمة، الكود، أو الصلاحية (مثال: تحويل الرصيد، *247#)...">
        </div>
    </header>

    <div class="grid-container" id="cardsGrid">
        <!-- Cards will be injected by JavaScript -->
    </div>
    <div class="no-results" id="noResults">لا توجد أكواد تطابق بحثك. حاول بكلمات أخرى!</div>

    <script>
        const codesData = [
            {
                code: "*247#",
                title: "تغيير خطة الاسعار او العودة لمظلة الشركة من نظام Extra",
                user: "المفوض فقط",
                userType: "auth",
                details: "لتغيير الباقات والخدمات. بيمشي في الخطوات: لغة > شركات > تغيير النظام أو الخدمات."
            },
            {
                code: "*247*93#",
                title: "إضافة فليكسات اكسترا (القديمة)",
                user: "المفوض فقط",
                userType: "auth",
                details: "مخصصة للباقات القديمة (2015, 2017, 2020) وقيمتها بتنزل على الفاتورة."
            },
            {
                code: "*247*24#",
                title: "إضافة فليكسات اكسترا (الجديدة)",
                user: "المفوض فقط",
                userType: "auth",
                details: "مخصصة للباقات الجديدة (2022, 2025)، ولازم يتضاف ليمت (Limit) للباقات الإضافية الأول."
            },
            {
                code: "*247*66*المبلغ#",
                title: "تفعيل خدمة Recharge on Bill",
                user: "المفوض فقط",
                userType: "auth",
                details: "زي سلف رصيد للخط، والمبلغ بيتضاف على فاتورة الشركة."
            },
            {
                code: "*247*67#",
                title: "الاستعلام عن Recharge on Bill",
                user: "المفوض فقط",
                userType: "auth",
                details: "لمعرفة الرصيد المتبقي من الخدمة. (بنعرف إذا كانت متاحة ليه من خلال نظام Siebel > Services > Supplementary)."
            },
            {
                code: "*010*202#",
                title: "تفعيل خدمة Take Your Bundle Abroad",
                user: "العميل / المفوض",
                userType: "all",
                details: "عشان العميل يقدر يستعمل من باقة النت بتاعته وهو مسافر برة مصر (بحد أقصى 10GB في الأسبوع حسب النظام)."
            },
            {
                code: "*010*010#",
                title: "إلغاء الاشتراكات والخدمات الترفيهية",
                user: "متاح للكل",
                userType: "all",
                details: "كود موحد بيلغي أي اشتراكات ترفيهية عشان لو في مشكلة وعايز يشترك تاني من جديد بشكل صحيح."
            },
            {
                code: "**21*الرقم#",
                title: "تحويل المكالمات (Call Divert)",
                user: "متاح للكل",
                userType: "all",
                details: "بيحول كل المكالمات اللي بتيجي للخط للرقم اللي هيكتبه العميل."
            },
            {
                code: "##21#",
                title: "إلغاء تحويل المكالمات (المباشر)",
                user: "متاح للكل",
                userType: "all",
                details: "بيلغي تحويل المكالمات اللي اتفعل باستخدام الكود المباشر **21*."
            },
            {
                code: "##002#",
                title: "إلغاء كل أنواع تحويل المكالمات",
                user: "متاح للكل",
                userType: "all",
                details: "كود شامل بيلغي أي تحويل مكالمات شغال على الخط أياً كان نوعه."
            },
            {
                code: "*868*2*الرقم#",
                title: "تحويل الرصيد المباشر",
                user: "متاح للكل",
                userType: "all",
                details: "لتحويل الرصيد المباشر لرقم تاني. (بيخصم نسبة ضريبة 18% على التحويل)."
            },
            {
                code: "من قائمة *247#",
                title: "إشعار نهاية المكالمة (End of Call)",
                user: "المفوض فقط",
                userType: "auth",
                details: "بتتفعل من خدمات *247#. تكلفتها 1 جنيه في الشهر (لو مش بتنزل مجاناً مع الباقة)، ومش موجودة في أنظمة RED."
            },
            {
                code: "*247# من قائمة",
                title: "الاحتفاظ بالمكالمات (Missed Call Keeper)",
                user: "المفوض فقط",
                userType: "auth",
                details: "بتتفعل من خدمات *247#. تكلفتها 5 جنيه في الشهر لمعرفة مين حاول يتصل بيك."
            },
            {
                code: "*247*200*num#",
                title: "on bill MI service",
                user: "المفوض فقط",
                userType: "auth",
                details: "عشان لو المفوض حب يضيف limit للمستخدم عشان يشحن نت و اخره 5 مرات ف الشهر "
            },
            {
                code: "*247*400*num#",
                title: "3al el fatora service",
                user: "المفوض فقط",
                userType: "auth",
                details: "عشان لو المفوض حب يضيف limit للمستخدم عشان يشحن نت و اخره 5 مرات ف الشهر "
            }
        ];

        const grid = document.getElementById('cardsGrid');
        const noResults = document.getElementById('noResults');

        const renderCards = (data) => {
            if(data.length === 0) {
                grid.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }
            noResults.style.display = 'none';
            grid.innerHTML = data.map(item => `
                <div class="card">
                    <div class="card-title">${item.title}</div>
                    <div class="card-code">${item.code}</div>
                    <div class="card-details">
                        <span class="badge ${item.userType}">${item.user}</span>
                        <p class="details-text">${item.details}</p>
                    </div>
                </div>
            `).join('');
        };

        // Initial render
        renderCards(codesData);

        // Search logic
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            const filtered = codesData.filter(item => 
                item.title.toLowerCase().includes(term) || 
                item.code.toLowerCase().includes(term) || 
                item.details.toLowerCase().includes(term) ||
                item.user.toLowerCase().includes(term)
            );
            renderCards(filtered);
        });
    </script>
</body>
</html>
